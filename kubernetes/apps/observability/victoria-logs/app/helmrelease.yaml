---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      retentionPeriod: 30d
      # Syslog from the UDM (Activity Logging -> SIEM Server), exposed by service.yaml
      syslog:
        udp:
          - name: syslog-udp
            value: :5140
        tcp:
          - name: syslog-tcp
            value: :5140
      route:
        enabled: true
        hostnames:
          - victoria-logs.${SECRET_DOMAIN}
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: victorialogs.png
          gethomepage.dev/name: Victoria-Logs
          gethomepage.dev/group: Observability
          gethomepage.dev/pod-selector: app.kubernetes.io/name=victoria-logs-single
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
