---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: slskd
  interval: 1h
  values:
    controllers:
      slskd:
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.0
            env:
              TZ: America/New_York
              SLSKD_APP_DIR: /config
              SLSKD_DOWNLOADS_DIR: /media/Downloads/Soulseek/Complete
              SLSKD_INCOMPLETE_DIR: /media/Downloads/Soulseek/Incomplete
              SLSKD_SHARED_DIR: /media/Downloads/Soulseek/Shared
              SLSKD_SLSK_LISTEN_PORT: 39036
              SLSKD_HTTP_AUTHENTICATION: "true"
              SLSKD_REMOTE_CONFIGURATION: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 1Gi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vpn",
            "namespace": "kube-system",
            "ips": ["192.168.40.50/24"]
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 5030
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: slskd
          gethomepage.dev/icon: slskd.png
          gethomepage.dev/group: Downloads
          gethomepage.dev/description: Soulseek Client
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: galactus.internal
        path: /mnt/uatu/Media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
