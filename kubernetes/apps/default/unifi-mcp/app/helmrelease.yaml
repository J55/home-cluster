---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp
  interval: 1h
  values:
    controllers:
      unifi-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.48.1@sha256:20651c8da109229f14aa876370150e579b1b9ad42c7d52c30a8844d700b5a2a6
            env:
              TZ: America/New_York
              UNIFI_HOST: 192.168.0.1
              UNIFI_POLICY_CREATE: "false"
              UNIFI_POLICY_UPDATE: "false"
              UNIFI_POLICY_DELETE: "false"
              UNIFI_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,unifi-mcp.${SECRET_DOMAIN}
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_NETWORK_WEBSOCKET_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
